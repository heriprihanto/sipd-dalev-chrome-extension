<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Opsi SIPD DALEV</title>
    <style>
      body {
        font-family: system-ui, "Segoe UI", sans-serif;
        margin: 24px;
        max-width: 560px;
        color: #222;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.petunjuk {
        color: #666;
        font-size: 13px;
        margin: 0 0 20px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin: 14px 0 4px;
      }
      input {
        width: 100%;
        padding: 7px 9px;
        font-size: 14px;
        border: 1px solid #bbb;
        border-radius: 4px;
        box-sizing: border-box;
      }
      small {
        color: #777;
        display: block;
        margin-top: 3px;
      }
      .tombol {
        margin-top: 20px;
        display: flex;
        gap: 8px;
      }
      button {
        padding: 7px 14px;
        font-size: 14px;
        border-radius: 4px;
        border: 1px solid #bbb;
        background: #f5f5f5;
        cursor: pointer;
      }
      button.utama {
        background: #2e7d32;
        border-color: #2e7d32;
        color: #fff;
      }
      #status {
        margin-top: 16px;
        font-size: 13px;
        white-space: pre-wrap;
      }
      .ok {
        color: #2e7d32;
      }
      .gagal {
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <h1>REST API SIPD DALEV</h1>
    <p class="petunjuk">
      Tombol <b>Download Program</b> dan <b>Download Subkegiatan</b> mengirim
      hasil unduhan ke REST API di alamat berikut untuk disimpan ke PostgreSQL.
    </p>

    <label for="apiBaseUrl">Alamat API</label>
    <input id="apiBaseUrl" type="text" placeholder="http://localhost:8000" />
    <small>Tanpa garis miring di akhir. Contoh: http://192.168.50.75:8000</small>

    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="kosongkan bila API_KEY di .env kosong" />
    <small>Dikirim sebagai header <code>X-API-Key</code>.</small>

    <div class="tombol">
      <button id="simpan" class="utama" type="button">Simpan</button>
      <button id="uji" type="button">Uji Koneksi</button>
    </div>

    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
